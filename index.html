<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F3EAD3" />
    <title>Apeiron</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23f0d78c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas" aria-label="Apeiron canvas"></canvas>
    <p class="sr-only" id="description">
      Pan and zoom a depth atlas. Arrow keys pan. Plus and minus zoom. Text and images
      appear only inside their zoom range.
    </p>
    <ul id="labels" class="sr-only" aria-label="Labels in view"></ul>
    <header>
      <h1>Apeiron</h1>
      <p id="status"></p>
    </header>
    <p id="hint">
      Drag to pan. Scroll or pinch to zoom toward the pointer. Double-tap to zoom in.
      Two-finger tap to zoom out. Arrow keys pan. + and − zoom.
    </p>
    <div id="zoom">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
